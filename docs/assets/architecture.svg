<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1990" viewBox="0 0 2400 1990">
<title>Cold-Chain Claude MCP architecture</title>
<desc>Authenticated Streamlit requests run through the Claude Agent SDK and an in-process MCP server with four tools. Telemetry uses SQL Server, weather uses Open-Meteo, SOP retrieval uses BGE-M3 and Pinecone, and incident proposals require separate human approval. Backend events are audited.</desc>

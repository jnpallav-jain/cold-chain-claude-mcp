<text x="100" y="84.17" fill="#167e83" font-family="Arial, sans-serif" font-size="23" font-weight="700">COLD-CHAIN  /  CLAUDE MCP</text>
<text x="100" y="156.24" fill="#17263e" font-family="Arial, sans-serif" font-size="56" font-weight="700">Evidence to action, with human control</text>
<text x="100" y="208.12" fill="#5a6a80" font-family="Arial, sans-serif" font-size="28" font-weight="400">Claude Agent SDK  ·  Four MCP tools  ·  Dense SOP retrieval  ·  Local Docker application</text>

# Prepared for a selected Linux host; do not apply until DNS/access/publication are approved.
services:
  web:
    environment:
      STREAMLIT_BROWSER_SERVER_ADDRESS: ${DEMO_DOMAIN:?Set an owned DNS hostname}
  proxy:
    image: caddy:2
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set an owned DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
